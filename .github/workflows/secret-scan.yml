name: Secret Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: High-signal credential shapes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked text for credential shapes
        run: |
          set -euo pipefail
          if git grep -I -n -E 'AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|sk_live_[A-Za-z0-9]{24,}|-----BEGIN PRIVATE KEY-----|rnd_[A-Za-z0-9]{20,}' \
            -- . ':!.github/workflows/secret-scan.yml'; then
            echo "Possible secret shape found"
            exit 1
          fi
          echo "secret-scan: ok"
